spring.application.name=movie-web

# Local development: values can be placed in Server/.env (git-ignored). Real env vars win.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8000}
# Only trust X-Forwarded-* when running behind a trusted reverse proxy (set to "framework" there).
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
server.shutdown=graceful
server.compression.enabled=true
server.compression.mime-types=application/json
server.max-http-request-header-size=16KB
server.tomcat.max-swallow-size=64KB
server.tomcat.max-http-form-post-size=64KB

# Never leak internals in error responses
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
spring.mvc.problemdetails.enabled=true

# MongoDB - credentials MUST come from the environment, never from source control
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:movie-api-db}
spring.data.mongodb.auto-index-creation=${MONGODB_AUTO_INDEX:true}

# Actuator: expose only health/info, no details to anonymous callers
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false

# Application settings
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:8080}
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.read-requests-per-minute=${RATE_LIMIT_READS_PER_MINUTE:120}
app.rate-limit.write-requests-per-minute=${RATE_LIMIT_WRITES_PER_MINUTE:10}
app.seed.enabled=${SEED_DATA:true}

spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=true
